name: Публикация в ВКонтакте

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Новое эссе]
    types:
      - completed

jobs:
  post-to-vk:
    # Убрали 'if' отсюда — он не работает с workflow_run
    runs-on: ubuntu-latest

    # Используем условие через steps
    steps:
      - name: 🔹 Проверка результата предыдущего workflow
        # Эта проверка имеет смысл только при срабатывании от другого workflow:
        # при ручном запуске (workflow_dispatch) github.event.workflow_run пуст,
        # и шаг бессмысленно валил бы запуск.
        if: github.event_name == 'workflow_run'
        run: |
          echo "Предыдущий workflow завершился с результатом: ${{ github.event.workflow_run.conclusion }}"
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "❌ Предыдущий workflow не удался или был отменён. Публикация отменена."
            exit 1  # Не ошибка, просто выход
          fi

      - name: 🔹 Checkout кода
        uses: actions/checkout@v5

      - name: 🔹 Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔹 Установка зависимостей
        run: |
          pip install requests vk-api

      - name: 🔹 Публикация в ВК
        env:
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_ALBUM_ID: ${{ secrets.VK_ALBUM_ID }}
        run: |
          python vk/vk_poster.py

      # --- НОВЫЙ ШАГ: фиксация удаления изображения в Git ---
      - name: 🔹 Commit and push deleted image
        run: |
          # Проверяем, есть ли удалённые файлы в локальной директории data/images/
          if [[ -n "$(git status --porcelain data/images/)" ]]; then
            echo "🖼️ Обнаружены изменения в data/images/ (файлы были удалены локально)."
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add data/images/
            git commit -m "🗑️ Удалено опубликованное изображение из data/images/"
            # Обновляем ветку перед пушем, используя rebase для избежания merge-коммита
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "❌ Ошибка при обновлении ветки перед пушем (возможно, конфликт)."
              exit 1
            }
            git push
            echo "✅ Удаление изображения зафиксировано в Git и отправлено в репозиторий."
          else
            echo "ℹ️ Изменений в data/images/ не обнаружено (файл мог не существовать или не быть удалён локально)."
          fi
        shell: bash
      # --- КОНЕЦ НОВОГО ШАГА ---
